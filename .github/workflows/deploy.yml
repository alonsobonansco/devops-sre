name: Taller1
on:
  push:
    branches:
      - main

  workflow_dispatch:
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: obtener el codigo
        uses: actions/checkout@v7

      - name: crear carpeta en el servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{secrets.IP_PUBLICA}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          source: "Dockerfile,compose.yaml,app.py,profile.json,requirements.txt,templates/"
          target: "/home/${{secrets.USERNAME}}/proyecto1"
          rm: true
          overwrite: true

      - name: levantar contenedor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.IP_PUBLICA}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          script: |
            cd /home/${{secrets.USERNAME}}/proyecto1
            docker compose down
            docker compose up -d --build
